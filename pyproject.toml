[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atp-utils"
version = "0.2.0"
description = "Module for working with ATP data files and extracting results"
readme = "README.rst"
license = {text = "MIT"}
authors = [{name = "Paul David Brown", email = "pdb.lists@gmail.com"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "xarray>=0.19",
    "text-data-cards",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock",
]

[project.scripts]
make-ss-csv = "atp_utils.cli:main"

[project.urls]
Repository = "https://github.com/pdb5627/pyATP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--pdbcls=IPython.terminal.debugger:Pdb"
required_plugins = "pytest-mock"
